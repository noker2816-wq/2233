name: 전광판 동기화·배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron은 UTC 기준. 평일 한국시간 07:00~19:50, 10분마다
    - cron: '*/10 22-23 * * 0-4'   # KST 월~금 07~08시
    - cron: '*/10 0-10 * * 1-5'    # KST 월~금 09~19시

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 테스트
        run: npm test
      - name: 노션 읽어서 암호화
        run: node scripts/sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BOARD_PASSWORD: ${{ secrets.BOARD_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
